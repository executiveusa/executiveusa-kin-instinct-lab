<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIN Persona Simulator</title><style>*{box-sizing:border-box}body{margin:0;font:14px Arial;background:#f2f0e8;color:#151712}button,textarea{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr 270px}.side{padding:18px;background:#e9e6dc}.left{border-right:1px solid #c9c5b8}.right{border-left:1px solid #c9c5b8}.brand{font-weight:800;letter-spacing:.15em;margin-bottom:20px}.persona,.starter{width:100%;text-align:left;padding:10px;margin:3px 0;border:1px solid transparent;background:transparent;cursor:pointer}.persona.active,.starter{background:#fff;border-color:#c9c5b8}.persona small{display:block;color:#666}.chat{display:flex;flex-direction:column}.top{padding:17px;border-bottom:1px solid #c9c5b8;display:flex;justify-content:space-between}.flag{font-size:10px;border:1px solid #a77c23;padding:5px}.messages{flex:1;padding:20px;overflow:auto}.msg{display:flex;margin-bottom:14px}.user{justify-content:flex-end}.bubble{max-width:78%;padding:12px;background:#fff;border:1px solid #c9c5b8;white-space:pre-wrap;line-height:1.5}.user .bubble{background:#1b1d18;color:#fff}.composer{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px;border-top:1px solid #c9c5b8}.composer textarea{padding:10px}.composer button{background:#1b1d18;color:white;border:0;padding:0 18px}.note{font-size:11px;line-height:1.5;color:#666}@media(max-width:800px){.app{display:block}.left{display:flex;overflow:auto}.persona{min-width:170px}}</style></head><body><div class="app"><aside class="side left"><div class="brand">KIN</div><div id="people"></div></aside><main class="chat"><div class="top"><div><b id="nm"></b><div id="rl"></div></div><span class="flag">SIMULATION</span></div><div id="msgs" class="messages"></div><div class="composer"><textarea id="inp" placeholder="Talk normally. No special prompt needed."></textarea><button id="send">Send</button></div></main><aside class="side right"><b>TRY ASKING</b><div id="starts"></div><p class="note">Portable behavior prototype. Not a live Instinct connection.</p></aside></div><script>
const P={founder:{n:"KIN-001",r:"Founder Deployment Agent",o:"Tell me what matters today, what is stuck, or what you wish someone else would handle. You do not need special prompts.",a:["I have too much going on. Help me decide what matters today.","Prepare me for my next meeting.","What can you take off my plate?"]},disability:{n:"KIN-D01",r:"Disability Administrative Navigator",o:"You can talk to me normally. We can work through paperwork, appointments and follow-ups one manageable step at a time.",a:["I got a letter I do not understand.","Help me prepare for an appointment.","Turn this into very small steps."]},nonprofit:{n:"KIN-N01",r:"Tiny Nonprofit Chief of Staff",o:"Tell me the outcome your team is trying to create, what is due, or what keeps slipping.",a:["We have three people and too much work.","Prepare our next team meeting.","Build a volunteer follow-up system."]},field:{n:"KIN-F01",r:"Remote Field Logistics Simulator",o:"I can help structure check-ins, contacts, supplies and escalation. This is simulation-first.",a:["Build a weak-connectivity check-in plan.","What if someone misses check-ins?","Make a low-tech backup plan."]}};let active="founder",M={};Object.keys(P).forEach(k=>M[k]=[{w:"agent",t:P[k].o}]);const e=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));function answer(k){if(k==="disability")return"We can make this smaller. What part is hardest right now: understanding what is being asked, remembering the steps, contacting someone, or tracking a deadline?";if(k==="nonprofit")return"What result must the nonprofit deliver this week? I will work backward from that and keep relationship-sensitive communication under human approval.";if(k==="field")return"What environment are we simulating and who is the designated human lead? I will design fallbacks without promising connectivity or safety.";return"What outcome would make today meaningfully better if finished? I can help sort the rest into do now, delegate, schedule, or ignore for now. You keep the decision."}function render(){let p=P[active];nm.textContent=p.n;rl.textContent=p.r;people.innerHTML=Object.entries(P).map(([k,v])=>'<button class="persona '+(k===active?'active':'')+'" data-p="'+k+'"><b>'+v.n+'</b><small>'+v.r+'</small></button>').join("");msgs.innerHTML=M[active].map(x=>'<div class="msg '+(x.w==="user"?"user":"")+'"><div class="bubble">'+e(x.t)+'</div></div>').join("");starts.innerHTML=p.a.map((x,i)=>'<button class="starter" data-s="'+i+'">'+e(x)+'</button>').join("");document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{active=b.dataset.p;render()});document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{inp.value=p.a[+b.dataset.s];inp.focus()});msgs.scrollTop=msgs.scrollHeight}function go(){let t=inp.value.trim();if(!t)return;M[active].push({w:"user",t},{w:"agent",t:answer(active)});inp.value="";render()}send.onclick=go;inp.onkeydown=x=>{if(x.key==="Enter"&&!x.shiftKey){x.preventDefault();go()}};render();</script></body></html>
